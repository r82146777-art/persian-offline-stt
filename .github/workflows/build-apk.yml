name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate wrapper and build debug APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: persian-offline-stt-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.3
          name: "v1.6.3 - Long-press Space + Symbols + No auto voice"
          body: |
            ## نسخه ۱.۶.۳

            - تایپ صوتی فقط با فشار طولانی فاصله یا دکمه MIC (بدون شروع خودکار)
            - ویبره هنگام فعال شدن صوت
            - لایه اعداد و علائم (دکمه 123)
            - چیدمان فارسی بهبود یافته
            - رفع کرش هنگام توقف
            - تنظیم ویبره از منوی برنامه

            استفاده: فشار طولانی روی فاصله برای صوت، دوباره MIC برای توقف.
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
