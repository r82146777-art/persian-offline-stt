name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate wrapper and build debug APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: persian-offline-stt-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: "v1.4.0 - System Keyboard (IME) + crash fixes"
          body: |
            ## تغییرات نسخه ۱.۴.۰
            - اضافه شدن کیبورد سیستم (Input Method) برای تایپ صوتی مستقیم در هر برنامه
            - رفع کرش اجازه میکروفون و دکمه توقف
            - تبدیل اعداد گفتاری به رقم بدون فاصله
            - کاملاً آفلاین بعد از دانلود مدل

            ### نحوه فعال‌سازی کیبورد:
            ۱. مدل را یک‌بار از داخل برنامه دانلود کنید
            ۲. تنظیمات گوشی → زبان و ورودی → کیبوردها → «تایپ صوتی آفلاین همدل» را روشن کنید
            ۳. در هر اپلیکیشنی کیبورد را عوض کنید و صحبت کنید

            کانال: https://t.me/Akademi_hamdel
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
