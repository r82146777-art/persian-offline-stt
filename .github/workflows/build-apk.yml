name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate wrapper and build debug APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: persian-offline-stt-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.6
          name: "v1.6.6 - Single-tap + fix space + voice sounds"
          body: |
            ## نسخه ۱.۶.۶

            - همه کلیدها تک‌ضربه (مناسب صفحه‌خوان)
            - دکمه فاصله درست شد: تک‌ضربه = فاصله
            - فشار طولانی فاصله = تایپ صوتی
            - صدای بوق هنگام شروع و توقف صوت
            - دکمه MIC برای شروع/توقف
            - ویبره و صدای کلید

            ### استفاده
            ۱. مدل را دانلود کنید
            ۲. کیبورد را در تنظیمات روشن کنید
            ۳. تک‌ضربه فاصله = فاصله | فشار طولانی فاصله = صوت
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
