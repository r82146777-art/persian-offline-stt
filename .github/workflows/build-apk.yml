name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Download sherpa-onnx AAR
        run: |
          mkdir -p app/libs
          curl -L --fail -o app/libs/sherpa-onnx.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.6/sherpa-onnx-1.12.6.aar" \
          || curl -L --fail -o app/libs/sherpa-onnx.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.10.42/sherpa-onnx-1.10.42.aar"
          ls -lh app/libs/

      - name: Generate wrapper and build debug APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: persian-offline-stt-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: "v3.0.0 - موتور قوی Shenava Rizeh (فارسی)"
          body: |
            ## نسخه ۳.۰.۰ — موتور جدید قوی
            * موتور اصلی: **Shenava Rizeh** (مدل اختصاصی فارسی FastConformer)
            * دقت خیلی بالاتر از Vosk روی فارسی
            * پشتیبان: Whisper + Vosk
            * بار اول مدل Shenava (~۳۷ مگ) را دانلود کنید
            * کلیپ‌بورد + کیبورد RTL
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
