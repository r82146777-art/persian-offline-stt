name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android licenses & local.properties
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          # fallback path on some images
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Download sherpa-onnx AAR
        run: |
          mkdir -p app/libs
          curl -L --fail -o app/libs/sherpa-onnx.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar"
          ls -lh app/libs/

      - name: Generate wrapper and build debug APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: persian-offline-stt-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.0
          name: "v4.0.0 - Vosk grammar + dictionary (spec rewrite)"
          body: |
            ## نسخه ۳.۱۶.۰
            * موتور تشخیص: Vosk آفلاین
            * اصلاح متن و ایموجی هوشمند با API (کلید مبهم‌سازی‌شده)
            * در نبود اینترنت، اصلاح محلی
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
