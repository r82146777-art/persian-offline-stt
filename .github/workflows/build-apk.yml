name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate wrapper and build debug APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: persian-offline-stt-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.1
          name: "v1.4.1 - Crash-safe stop + IME fixes"
          body: |
            ## تغییرات ۱.۴.۱
            - دکمه توقف دیگر باعث خروج از برنامه نمی‌شود (کاملاً امن شده)
            - کیبورد سیستم (IME) بهبود یافته: مسیر مدل درست، نمایش اجباری پنل، توقف امن
            - تبدیل اعداد به رقم همچنان کار می‌کند

            ### نحوه استفاده از کیبورد:
            ۱. اول از داخل برنامه مدل را دانلود کنید
            ۲. تنظیمات → زبان و ورودی → کیبوردها → «تایپ صوتی آفلاین همدل» را روشن کنید
            ۳. در هر برنامه کیبورد را عوض کنید

            نکته: برای دقت خیلی بالاتر (نزدیک گوگل + تشخیص خودکار زبان) نیاز به تغییر موتور به Whisper است که در نسخه بعدی انجام می‌شود.
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
