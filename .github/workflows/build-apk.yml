name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate wrapper and build debug APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: persian-offline-stt-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.1
          name: "v1.6.1 - Long-press Space + Sound/Vibe + Symbols"
          body: |
            ## نسخه ۱.۶.۱

            - تایپ صوتی خودکار خاموش شد (فقط با فشار طولانی فاصله یا دکمه میکروفون)
            - صدا و ویبره هنگام فعال شدن صوت و تایپ کلیدها
            - چیدمان فارسی بهبود یافته
            - لایه اعداد/علائم
            - رفع کرش توقف
            - تنظیمات صدا و ویبره در منوی برنامه

            نحوه استفاده: فشار طولانی روی فاصله برای صوت، دوباره میکروفون برای توقف.
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
