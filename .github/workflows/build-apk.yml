name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate wrapper and build debug APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: persian-offline-stt-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.1
          name: "v1.5.1 - Full Keyboard FA/EN + Voice Mic"
          body: |
            ## نسخه ۱.۵.۱ — کیبورد کامل فارسی/انگلیسی + میکروفون صوتی

            - کیبورد تایپی کامل (فارسی و انگلیسی)
            - دکمه 🎤 برای تایپ صوتی آفلاین
            - تعویض زبان با دکمه FA/EN
            - تبدیل اعداد به رقم

            ### استفاده:
            ۱. مدل را از برنامه دانلود کنید
            ۲. کیبورد را در تنظیمات سیستم روشن کنید
            ۳. در برنامه‌ها این کیبورد را انتخاب کنید
            ۴. تایپ کنید یا دکمه میکروفون را بزنید

            موتور بعدی: Whisper برای دقت بالاتر.
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
