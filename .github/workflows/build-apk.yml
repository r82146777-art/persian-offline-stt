name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Download sherpa-onnx AAR
        run: |
          mkdir -p app/libs
          curl -L --fail -o app/libs/sherpa-onnx.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.6/sherpa-onnx-1.12.6.aar" \
          || curl -L --fail -o app/libs/sherpa-onnx.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.10.42/sherpa-onnx-1.10.42.aar" \
          || curl -L --fail -o app/libs/sherpa-onnx.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.40/sherpa-onnx-1.12.40.aar"
          ls -lh app/libs/

      - name: Generate wrapper and build debug APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: persian-offline-stt-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.0
          name: "v1.7.0 - Whisper offline engine"
          body: |
            ## نسخه ۱.۷.۰ — موتور Whisper آفلاین

            - موتور Whisper tiny چندزبانه (sherpa-onnx)
            - دقت بالاتر برای فارسی و انگلیسی
            - دانلود مدل ~۱۰۰ مگ از داخل برنامه
            - کیبورد تک‌ضربه + فشار طولانی فاصله برای صوت
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
