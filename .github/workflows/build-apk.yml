name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate wrapper and build debug APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: persian-offline-stt-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.5
          name: "v1.6.5 - Full keyboard + long-press space voice"
          body: |
            ## نسخه ۱.۶.۵

            - کیبورد کامل فارسی/انگلیسی (حروف جدا، بدون روی‌هم‌افتادن)
            - فشار طولانی SPACE برای تایپ صوتی (بدون شروع خودکار)
            - دکمه MIC برای شروع/توقف
            - لایه اعداد و علائم (دکمه 123)
            - ویبره هنگام تایپ و فعال شدن صوت
            - رفع کرش توقف

            ### استفاده
            ۱. مدل را از برنامه دانلود کنید
            ۲. کیبورد را در تنظیمات سیستم روشن کنید
            ۳. فشار طولانی فاصله = صوت، MIC = توقف
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
